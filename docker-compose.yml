services:
  frontend:
    image: ghcr.io/rorycondict/evp-website/frontend:latest
    container_name: evp-frontend
    depends_on:
      - backend
    ports:
      - "16017:16017"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # dev specific
    build:
      context: ./frontend 
      dockerfile: Dockerfile

  backend:
    image: ghcr.io/rorycondict/evp-website/backend:latest
    container_name: evp-backend
    # dev specific
    command: uv run uvicorn main:app --host 0.0.0.0 --port 17017 --reload
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/.venv
    build:
      context: ./backend
      dockerfile: Dockerfile