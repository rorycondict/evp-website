# The name of the workflow as it appears in the GitHub Actions tab
name: CI/CD Production Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "*.md"

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.service == 'frontend'
        run: npm ci
        working-directory: frontend

      - name: Lint frontend
        if: matrix.service == 'frontend'
        run: npm run lint
        working-directory: frontend

      # - name: Test frontend
      #   if: matrix.service == 'frontend'
      #   run: npm run test
      #   working-directory: frontend

      - name: Build frontend
        if: matrix.service == 'frontend'
        run: npm run build
        working-directory: frontend

      - name: Setup Python
        if: matrix.service == 'backend'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        if: matrix.service == 'backend'
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        if: matrix.service == 'backend'
        run: uv sync
        working-directory: backend

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      actions: read
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set lower case image name
        id: image-name
        run: |
          echo "image_name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_USER: ${{ github.actor }}
          DEPLOY_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }} # GitHub PAT
          IMAGE_TAG: ${{ github.sha }} # commit SHA
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: DEPLOY_USER,DEPLOY_TOKEN,IMAGE_TAG
          script: |
            set -e

            systemctl --user start podman.socket || true
            export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"

            cd ~/evp-website

            export IMAGE_TAG="$(echo "$IMAGE_TAG" | cut -c1-7)"
            echo "$DEPLOY_TOKEN" | docker login ghcr.io -u "$DEPLOY_USER" --password-stdin

            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f
