services:
  frontend:
    image: ghcr.io/rorycondict/evp-website/frontend:${IMAGE_TAG:-latest}
    container_name: evp-frontend
    depends_on:
      - backend
    ports:
      - "16017:16017"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # prod specific
    restart: unless-stopped

  backend:
    image: ghcr.io/rorycondict/evp-website/backend:${IMAGE_TAG:-latest}
    container_name: evp-backend
    # prod specific
    command: uv run --no-dev uvicorn src.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./.env
    restart: unless-stopped